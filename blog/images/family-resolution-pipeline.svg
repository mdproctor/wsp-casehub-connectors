<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <!-- Family YAML -->
  <rect x="20" y="30" width="180" height="100" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="110" y="55" text-anchor="middle" font-weight="bold" fill="#1a73e8">google.yaml</text>
  <text x="110" y="75" text-anchor="middle" fill="#555" font-size="11">auth-url, token-url</text>
  <text x="110" y="91" text-anchor="middle" fill="#555" font-size="11">scopes: [8 scopes]</text>
  <text x="110" y="107" text-anchor="middle" fill="#555" font-size="11">fields: client-id, client-secret</text>
  <text x="110" y="123" text-anchor="middle" fill="#555" font-size="11">consent: incremental</text>

  <!-- Connector YAML -->
  <rect x="20" y="160" width="180" height="80" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="110" y="185" text-anchor="middle" font-weight="bold" fill="#e37400">calendar-google</text>
  <text x="110" y="205" text-anchor="middle" fill="#555" font-size="11">auth.family: google</text>
  <text x="110" y="221" text-anchor="middle" fill="#555" font-size="11">auth.fields: (empty)</text>
  <text x="110" y="237" text-anchor="middle" fill="#555" font-size="11" font-style="italic">auth.oauth: (null)</text>

  <!-- Arrow from family + connector into loader -->
  <line x1="200" y1="80" x2="280" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="280" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loader box -->
  <rect x="285" y="120" width="170" height="80" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" font-weight="bold" fill="#333">enrichWithFamily()</text>
  <text x="370" y="170" text-anchor="middle" fill="#777" font-size="11">fields ← family.fields</text>
  <text x="370" y="186" text-anchor="middle" fill="#777" font-size="11">oauth ← family.oauth</text>

  <!-- Arrow from loader to enriched -->
  <line x1="455" y1="160" x2="505" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Enriched manifest -->
  <rect x="510" y="100" width="190" height="120" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="605" y="125" text-anchor="middle" font-weight="bold" fill="#137333">Enriched Manifest</text>
  <text x="605" y="145" text-anchor="middle" fill="#555" font-size="11">auth.family: google</text>
  <text x="605" y="161" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">auth.fields: client-id, secret</text>
  <text x="605" y="177" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">auth.oauth: ✓ (from family)</text>
  <text x="605" y="193" text-anchor="middle" fill="#555" font-size="11">credentialKey() → "google"</text>
  <text x="605" y="209" text-anchor="middle" fill="#555" font-size="11" font-style="italic">self-contained — no family lookup needed</text>

  <!-- Legend -->
  <rect x="20" y="275" width="680" height="50" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="40" y="298" fill="#555" font-size="11">After resolution, every consumer — build steps, registry, MCP tools — sees the same enriched data.</text>
  <text x="40" y="314" fill="#555" font-size="11">credentialKey() returns "google" for all family members → shared credentials, one consent flow.</text>
</svg>
