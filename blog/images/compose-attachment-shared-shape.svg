<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <style>
      .box { stroke: #374151; stroke-width: 1.5; rx: 6; }
      .shared-zone { fill: #ecfdf5; }
      .path-zone { fill: #eff6ff; }
      .label { font-weight: 600; font-size: 12; fill: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
      .field { font-size: 13; fill: #1f2937; }
      .field-key { font-weight: 600; }
      .zone-label { font-size: 11; fill: #9ca3af; font-style: italic; }
      .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .title { font-size: 15; font-weight: 700; fill: #111827; }
      .method { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12; fill: #1f2937; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" class="title">Two paths, one shape — what cardContent() makes explicit</text>

  <!-- Left path: Builder preview -->
  <rect x="40" y="50" width="280" height="100" class="box path-zone"/>
  <text x="60" y="72" class="label">Builder.build()</text>
  <text x="60" y="96" class="field">Wraps adaptive card JSON</text>
  <text x="60" y="116" class="field">Adds optional <tspan class="field-key">preview</tspan> envelope</text>
  <text x="60" y="136" class="zone-label">Preview content needs: title, subtitle?, images?</text>

  <!-- Right path: CardBuilder -->
  <rect x="360" y="50" width="280" height="100" class="box path-zone"/>
  <text x="380" y="72" class="label">CardBuilder.build()</text>
  <text x="380" y="96" class="field">Builds hero or thumbnail card</text>
  <text x="380" y="116" class="field">Adds <tspan class="field-key">buttons</tspan> and <tspan class="field-key">tap</tspan> after content</text>
  <text x="380" y="136" class="zone-label">Card content needs: title, subtitle?, images?</text>

  <!-- Arrows converging -->
  <path d="M180,150 L180,180 L340,195" class="arrow"/>
  <path d="M500,150 L500,180 L348,195" class="arrow"/>

  <!-- Shared helper -->
  <rect x="140" y="195" width="400" height="120" class="box shared-zone"/>
  <text x="160" y="217" class="label">cardContent(title, subtitle, imageUrl)</text>
  <text x="160" y="245" class="method">"title": title</text>
  <text x="160" y="265" class="method">"subtitle": subtitle       <tspan class="zone-label" font-family="system-ui, -apple-system, sans-serif">← only if non-null</tspan></text>
  <text x="160" y="285" class="method">"images": [{"url": imageUrl}]  <tspan class="zone-label" font-family="system-ui, -apple-system, sans-serif">← only if non-null</tspan></text>
  <text x="160" y="305" class="zone-label">Returns JsonObjectBuilder — callers extend or consume</text>

  <!-- Legend -->
  <rect x="140" y="325" width="12" height="12" fill="#eff6ff" stroke="#374151" stroke-width="1" rx="2"/>
  <text x="158" y="336" class="zone-label" style="fill: #374151;">Context-specific logic (each path adds its own)</text>
  <rect x="400" y="325" width="12" height="12" fill="#ecfdf5" stroke="#374151" stroke-width="1" rx="2"/>
  <text x="418" y="336" class="zone-label" style="fill: #374151;">Shared protocol shape (extracted helper)</text>
</svg>
