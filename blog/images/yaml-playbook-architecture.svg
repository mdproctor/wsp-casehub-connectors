<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Playbook Test Architecture</text>

  <!-- YAML layer -->
  <rect x="40" y="56" width="200" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="140" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">YAML — zero Java</text>

  <rect x="56" y="90" width="168" height="36" rx="4" fill="white" stroke="#bfdbfe"/>
  <text x="140" y="113" text-anchor="middle" font-size="10" fill="#1e40af">playbook.yaml</text>

  <rect x="56" y="134" width="168" height="36" rx="4" fill="white" stroke="#bfdbfe"/>
  <text x="140" y="157" text-anchor="middle" font-size="10" fill="#1e40af">test.yaml (assertions)</text>

  <rect x="56" y="178" width="168" height="28" rx="4" fill="white" stroke="#bfdbfe"/>
  <text x="140" y="197" text-anchor="middle" font-size="10" fill="#1e40af">yaml-services.yaml</text>

  <!-- Engine layer -->
  <rect x="300" y="56" width="200" height="160" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Platform Engine</text>

  <rect x="316" y="90" width="168" height="28" rx="4" fill="white" stroke="#bbf7d0"/>
  <text x="400" y="109" text-anchor="middle" font-size="10" fill="#15803d">YamlTestEngine</text>

  <rect x="316" y="126" width="168" height="28" rx="4" fill="white" stroke="#bbf7d0"/>
  <text x="400" y="145" text-anchor="middle" font-size="10" fill="#15803d">AptPluginSource</text>

  <rect x="316" y="162" width="168" height="28" rx="4" fill="white" stroke="#bbf7d0"/>
  <text x="400" y="181" text-anchor="middle" font-size="10" fill="#15803d">ServiceRegistry</text>

  <!-- Plugin layer -->
  <rect x="560" y="56" width="200" height="160" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="660" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">@Plugin Records</text>

  <rect x="576" y="90" width="168" height="24" rx="4" fill="white" stroke="#fde68a"/>
  <text x="660" y="107" text-anchor="middle" font-size="9" fill="#a16207">stt-transcribe</text>

  <rect x="576" y="120" width="168" height="24" rx="4" fill="white" stroke="#fde68a"/>
  <text x="660" y="137" text-anchor="middle" font-size="9" fill="#a16207">tts-synthesise</text>

  <rect x="576" y="150" width="168" height="24" rx="4" fill="white" stroke="#fde68a"/>
  <text x="660" y="167" text-anchor="middle" font-size="9" fill="#a16207">bank-balance</text>

  <rect x="576" y="180" width="80" height="24" rx="4" fill="white" stroke="#fde68a"/>
  <text x="616" y="197" text-anchor="middle" font-size="9" fill="#a16207">chat-send</text>

  <rect x="664" y="180" width="80" height="24" rx="4" fill="white" stroke="#fde68a"/>
  <text x="704" y="197" text-anchor="middle" font-size="9" fill="#a16207">email-msgs</text>

  <!-- Arrows between layers -->
  <line x1="240" y1="110" x2="314" y2="110" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="155" x2="314" y2="145" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="192" x2="314" y2="180" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="484" y1="110" x2="574" y2="110" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="103" text-anchor="middle" font-size="8" fill="#94a3b8">discovers</text>

  <!-- Service resolution -->
  <rect x="300" y="260" width="200" height="100" rx="6" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="400" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Reference Implementations</text>

  <rect x="316" y="294" width="80" height="22" rx="4" fill="white" stroke="#fbcfe8"/>
  <text x="356" y="309" text-anchor="middle" font-size="8" fill="#be185d">VoicePlatform</text>

  <rect x="404" y="294" width="80" height="22" rx="4" fill="white" stroke="#fbcfe8"/>
  <text x="444" y="309" text-anchor="middle" font-size="8" fill="#be185d">BankPlatform</text>

  <rect x="316" y="322" width="80" height="22" rx="4" fill="white" stroke="#fbcfe8"/>
  <text x="356" y="337" text-anchor="middle" font-size="8" fill="#be185d">ChatPlatform</text>

  <rect x="404" y="322" width="80" height="22" rx="4" fill="white" stroke="#fbcfe8"/>
  <text x="444" y="337" text-anchor="middle" font-size="8" fill="#be185d">EmailPlatform</text>

  <line x1="400" y1="190" x2="400" y2="258" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="420" y="230" font-size="8" fill="#94a3b8">yaml-services.yaml</text>

  <!-- Execution flow -->
  <rect x="560" y="260" width="200" height="100" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="660" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Environments</text>

  <rect x="576" y="294" width="72" height="22" rx="4" fill="white" stroke="#ddd6fe"/>
  <text x="612" y="309" text-anchor="middle" font-size="8" fill="#7c3aed">Tests</text>

  <rect x="656" y="294" width="72" height="22" rx="4" fill="white" stroke="#ddd6fe"/>
  <text x="692" y="309" text-anchor="middle" font-size="8" fill="#7c3aed">Demo</text>

  <rect x="576" y="322" width="72" height="22" rx="4" fill="white" stroke="#ddd6fe"/>
  <text x="612" y="337" text-anchor="middle" font-size="8" fill="#7c3aed">Dev</text>

  <rect x="656" y="322" width="72" height="22" rx="4" fill="white" stroke="#ddd6fe"/>
  <text x="692" y="337" text-anchor="middle" font-size="8" fill="#7c3aed">Onboarding</text>

  <line x1="500" y1="310" x2="574" y2="310" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <text x="537" y="303" text-anchor="middle" font-size="8" fill="#3b82f6">same playbooks</text>

  <!-- Captures flow -->
  <rect x="40" y="280" width="200" height="80" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="140" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Captures — Precise Assertions</text>
  <text x="140" y="320" text-anchor="middle" font-size="9" fill="#047857" font-family="monospace">result.captures.balance.currency</text>
  <text x="140" y="338" text-anchor="middle" font-size="9" fill="#047857" font-family="monospace">result.captures.roundTrip.text</text>
  <text x="140" y="356" text-anchor="middle" font-size="9" fill="#047857" font-family="monospace">result.captures.audio.audio-format</text>

  <line x1="140" y1="216" x2="140" y2="278" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="400" y="410" text-anchor="middle" font-size="10" fill="#94a3b8">YAML playbook → test engine discovers plugins → ServiceRegistry provides platforms → captures flow to assertions</text>
  <text x="400" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">Same playbooks run in tests, demos, dev, and onboarding — only yaml-services.yaml changes</text>
</svg>
