<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .box { rx: 6; ry: 6; }
    .fixed { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; }
    .found { fill: #fff3e0; stroke: #ff9800; stroke-width: 1.5; }
    .still { fill: #fce4ec; stroke: #e91e63; stroke-width: 1.5; }
    .label { font-size: 11px; fill: #333; }
    .title { font-size: 13px; font-weight: 600; fill: #222; }
    .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .review { stroke: #999; stroke-width: 1; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead-light); }
    .legend-text { font-size: 10px; fill: #555; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrowhead-light" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Fix Chain: Each Fix Surfaced the Next Gap</text>

  <!-- Row 1: user: channel chain -->
  <rect class="box fixed" x="30" y="55" width="180" height="50"/>
  <text class="title" x="120" y="75" text-anchor="middle">sendMessage</text>
  <text class="label" x="120" y="92" text-anchor="middle">handles user: ✓</text>

  <path class="arrow" d="M210,80 L240,80"/>

  <rect class="box fixed" x="250" y="55" width="180" height="50"/>
  <text class="title" x="340" y="75" text-anchor="middle">replyToMessage</text>
  <text class="label" x="340" y="92" text-anchor="middle">user: missing → fixed</text>

  <path class="review" d="M430,80 L460,80"/>

  <rect class="box fixed" x="470" y="55" width="210" height="50"/>
  <text class="title" x="575" y="75" text-anchor="middle">delete / find</text>
  <text class="label" x="575" y="92" text-anchor="middle">personal: missing → fixed</text>

  <!-- Row 1 annotation -->
  <path class="review" d="M575,105 L575,135"/>

  <rect class="box still" x="470" y="140" width="210" height="50"/>
  <text class="title" x="575" y="160" text-anchor="middle">listMembers, reactions, ...</text>
  <text class="label" x="575" y="177" text-anchor="middle">user: still missing → filed</text>

  <!-- Row 2: SSRF chain -->
  <rect class="box fixed" x="30" y="215" width="180" height="50"/>
  <text class="title" x="120" y="235" text-anchor="middle">SSRF host check</text>
  <text class="label" x="120" y="252" text-anchor="middle">allowlist added ✓</text>

  <path class="review" d="M210,240 L240,240"/>

  <rect class="box fixed" x="250" y="215" width="180" height="50"/>
  <text class="title" x="340" y="235" text-anchor="middle">HTTPS enforcement</text>
  <text class="label" x="340" y="252" text-anchor="middle">scheme not checked → fixed</text>

  <path class="review" d="M430,240 L460,240"/>

  <rect class="box fixed" x="470" y="215" width="210" height="50"/>
  <text class="title" x="575" y="235" text-anchor="middle">timeout + size limit</text>
  <text class="label" x="575" y="252" text-anchor="middle">unbounded download → fixed</text>

  <!-- Row 3: Error chain -->
  <rect class="box fixed" x="30" y="300" width="180" height="50"/>
  <text class="title" x="120" y="320" text-anchor="middle">postJson → postJsonWith…</text>
  <text class="label" x="120" y="337" text-anchor="middle">errors now thrown ✓</text>

  <path class="review" d="M210,325 L240,325"/>

  <rect class="box fixed" x="250" y="300" width="180" height="50"/>
  <text class="title" x="340" y="320" text-anchor="middle">typed error mapping</text>
  <text class="label" x="340" y="337" text-anchor="middle">RuntimeException → typed</text>

  <path class="review" d="M430,325 L460,325"/>

  <rect class="box fixed" x="470" y="300" width="210" height="50"/>
  <text class="title" x="575" y="320" text-anchor="middle">InputStream leak</text>
  <text class="label" x="575" y="337" text-anchor="middle">early return → try-with ✓</text>

  <!-- Legend -->
  <rect class="box fixed" x="140" y="380" width="14" height="14"/>
  <text class="legend-text" x="160" y="392">Fixed this session</text>
  <rect class="box found" x="300" y="380" width="14" height="14"/>
  <text class="legend-text" x="320" y="392">Found by review</text>
  <rect class="box still" x="440" y="380" width="14" height="14"/>
  <text class="legend-text" x="460" y="392">Filed for next session</text>
  <line class="review" x1="30" y1="387" x2="60" y2="387"/>
  <text class="legend-text" x="66" y="392">review surfaced</text>
</svg>
