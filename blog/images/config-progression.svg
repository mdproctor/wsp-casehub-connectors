<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #4a4a6a; }
    .config { font-size: 10px; fill: #16537e; font-family: 'SF Mono', 'Consolas', monospace; }
    .box { fill: #f0f4f8; stroke: #c9d6e3; stroke-width: 1.5; rx: 6; }
    .box-active { fill: #e8f4f8; stroke: #4a90d9; stroke-width: 2; rx: 6; }
    .arrow { stroke: #8896a7; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .pattern-label { font-size: 10px; fill: #6b7b8d; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8896a7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title" font-size="14px">Progressive Configuration — From Hardcoded to Deployment-Ready</text>

  <!-- Phase 1: Hardcoded -->
  <rect x="20" y="50" width="200" height="90" class="box"/>
  <text x="120" y="72" text-anchor="middle" class="title">Hardcoded</text>
  <text x="120" y="92" text-anchor="middle" class="label">Works for one deployment</text>
  <text x="120" y="112" text-anchor="middle" class="config">ALLOWED_CDN_SUFFIXES</text>
  <text x="120" y="128" text-anchor="middle" class="config">teams.get(0)</text>

  <path d="M220,95 L260,95" class="arrow"/>

  <!-- Phase 2: Config Property -->
  <rect x="260" y="50" width="200" height="90" class="box-active"/>
  <text x="360" y="72" text-anchor="middle" class="title">Config Property</text>
  <text x="360" y="92" text-anchor="middle" class="label">Deployment chooses</text>
  <text x="360" y="112" text-anchor="middle" class="config">allowed-cdn-hosts</text>
  <text x="360" y="128" text-anchor="middle" class="config">default-team-id</text>

  <path d="M460,95 L500,95" class="arrow"/>

  <!-- Phase 3: Pattern -->
  <rect x="500" y="50" width="200" height="90" class="box"/>
  <text x="600" y="72" text-anchor="middle" class="title">Consistent Pattern</text>
  <text x="600" y="92" text-anchor="middle" class="label">Same shape everywhere</text>
  <text x="600" y="112" text-anchor="middle" class="config">sharepoint.site-id</text>
  <text x="600" y="128" text-anchor="middle" class="config">teams.default-team-id</text>

  <!-- Existing precedent -->
  <rect x="20" y="170" width="200" height="80" class="box"/>
  <text x="120" y="192" text-anchor="middle" class="title">SharePoint (existing)</text>
  <text x="120" y="212" text-anchor="middle" class="config">sharepoint.site-id</text>
  <text x="120" y="230" text-anchor="middle" class="pattern-label">Degrades when blank</text>

  <!-- New: CDN -->
  <rect x="260" y="170" width="200" height="80" class="box-active"/>
  <text x="360" y="192" text-anchor="middle" class="title">CDN Allow-List (new)</text>
  <text x="360" y="212" text-anchor="middle" class="config">allowed-cdn-hosts</text>
  <text x="360" y="230" text-anchor="middle" class="pattern-label">Defaults to 3 MS domains</text>

  <!-- New: Teams -->
  <rect x="500" y="170" width="200" height="80" class="box-active"/>
  <text x="600" y="192" text-anchor="middle" class="title">Teams Default (new)</text>
  <text x="600" y="212" text-anchor="middle" class="config">default-team-id</text>
  <text x="600" y="230" text-anchor="middle" class="pattern-label">Falls back to first team</text>

  <!-- Connecting lines bottom row -->
  <path d="M220,210 L260,210" class="arrow"/>
  <path d="M460,210 L500,210" class="arrow"/>
</svg>
