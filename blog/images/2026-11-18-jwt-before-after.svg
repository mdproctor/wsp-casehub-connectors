<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="8" fill="url(#bgGrad)" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">JWT Validation — Before &amp; After</text>

  <!-- BEFORE column -->
  <text x="180" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">BEFORE</text>
  <rect x="40" y="75" width="280" height="45" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="12" fill="#1e293b">Pub/Sub notification arrives</text>
  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#64748b">Authorization: Bearer &lt;jwt&gt;</text>
  <line x1="180" y1="120" x2="180" y2="145" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="80" y="148" width="200" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#991b1b">Parse claims only</text>
  <text x="180" y="183" text-anchor="middle" font-size="10" fill="#b91c1c">iss + aud + exp — no signature check</text>
  <line x1="180" y1="186" x2="180" y2="210" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="60" y="213" width="240" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#991b1b">⚠ Any forged JWT with valid claims passes</text>

  <!-- AFTER column -->
  <text x="540" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">AFTER</text>
  <rect x="400" y="75" width="280" height="45" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="95" text-anchor="middle" font-size="12" fill="#1e293b">Pub/Sub notification arrives</text>
  <text x="540" y="110" text-anchor="middle" font-size="11" fill="#64748b">Authorization: Bearer &lt;jwt&gt;</text>
  <line x1="540" y1="120" x2="540" y2="145" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="420" y="148" width="240" height="38" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="540" y="163" text-anchor="middle" font-size="12" fill="#166534">RS256 signature verification</text>
  <text x="540" y="178" text-anchor="middle" font-size="10" fill="#15803d">via Google JWKS (cached)</text>
  <line x1="540" y1="186" x2="540" y2="210" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="420" y="213" width="240" height="38" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="540" y="228" text-anchor="middle" font-size="12" fill="#166534">Claims validation</text>
  <text x="540" y="243" text-anchor="middle" font-size="10" fill="#15803d">iss + aud + exp (by jose4j)</text>
  <line x1="540" y1="251" x2="540" y2="270" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="440" y="273" width="200" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="540" y="292" text-anchor="middle" font-size="11" fill="#166534">✓ Only Google-signed JWTs pass</text>
</svg>
