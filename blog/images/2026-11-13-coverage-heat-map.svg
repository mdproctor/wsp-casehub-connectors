<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #666; }
    .cat-label { font-size: 12px; fill: #1a1a2e; text-anchor: end; }
    .provider { font-size: 10px; fill: #555; }
    .count { font-size: 10px; fill: #888; text-anchor: end; }
    .legend-text { font-size: 11px; fill: #444; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">casehub Platform Coverage by Domain</text>
  <text x="410" y="46" text-anchor="middle" class="subtitle">Green = 2+ providers  |  Yellow = 1 provider  |  Red = no coverage</text>

  <!-- Legend -->
  <rect x="250" y="56" width="16" height="12" rx="2" fill="#2d6a4f"/>
  <text x="270" y="66" class="legend-text">Green (2+)</text>
  <rect x="350" y="56" width="16" height="12" rx="2" fill="#e9c46a"/>
  <text x="370" y="66" class="legend-text">Yellow (1)</text>
  <rect x="450" y="56" width="16" height="12" rx="2" fill="#c1121f"/>
  <text x="470" y="66" class="legend-text">Red (none)</text>

  <!-- Row template: y starts at 85, each row 28px -->

  <!-- GREEN rows -->
  <rect x="180" y="82" width="580" height="24" rx="4" fill="#2d6a4f" opacity="0.12"/>
