<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#555"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; stroke-width: 1.5; }
      .label { font-weight: 600; font-size: 12px; fill: #333; }
      .sublabel { font-size: 11px; fill: #666; }
      .title { font-weight: 700; font-size: 15px; fill: #222; }
    </style>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" class="title">User-scoped accessor pattern: Google vs Microsoft</text>

  <!-- Shared top: MCP API layer -->
  <rect x="240" y="48" width="300" height="44" class="box" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="390" y="66" text-anchor="middle" class="label">ConnectorCalendarApi</text>
  <text x="390" y="82" text-anchor="middle" class="sublabel">currentPrincipal.actorId() = "user-42"</text>

  <!-- Arrow down to SPI -->
  <line x1="390" y1="92" x2="390" y2="118" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- SPI interface -->
  <rect x="240" y="120" width="300" height="36" class="box" fill="#fff3e0" stroke="#f9a825"/>
  <text x="390" y="143" text-anchor="middle" class="label">CalendarPlatform.calendarOps("user-42")</text>

  <!-- Split into two columns -->
  <!-- Left: Google -->
  <line x1="310" y1="156" x2="170" y2="186" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Right: Microsoft -->
  <line x1="470" y1="156" x2="610" y2="186" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Google column -->
  <text x="170" y="200" text-anchor="middle" class="title" font-size="13">Google</text>

  <rect x="40" y="212" width="260" height="50" class="box" fill="#e8f5e9" stroke="#43a047"/>
  <text x="170" y="231" text-anchor="middle" class="label">buildService("user-42")</text>
  <text x="170" y="249" text-anchor="middle" class="sublabel">getAccessToken  fresh Calendar client</text>

  <line x1="170" y1="262" x2="170" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="286" width="260" height="44" class="box" fill="#e8f5e9" stroke="#43a047"/>
  <text x="170" y="305" text-anchor="middle" class="label">GoogleCalendarOperations</text>
  <text x="170" y="320" text-anchor="middle" class="sublabel">captures Calendar service (immutable)</text>

  <line x1="170" y1="330" x2="170" y2="354" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="356" width="220" height="32" class="box" fill="#f5f5f5" stroke="#999"/>
  <text x="170" y="377" text-anchor="middle" class="sublabel">listCalendars() / listEvents() / ...</text>

  <!-- Microsoft column -->
  <text x="610" y="200" text-anchor="middle" class="title" font-size="13">Microsoft</text>

  <rect x="480" y="212" width="260" height="50" class="box" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="610" y="231" text-anchor="middle" class="label">captures userId = "user-42"</text>
  <text x="610" y="249" text-anchor="middle" class="sublabel">shared Graph client unchanged</text>

  <line x1="610" y1="262" x2="610" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="480" y="286" width="260" height="44" class="box" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="610" y="305" text-anchor="middle" class="label">MicrosoftCalendarOperations</text>
  <text x="610" y="320" text-anchor="middle" class="sublabel">resolveToken(userId) per call</text>

  <line x1="610" y1="330" x2="610" y2="354" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="500" y="356" width="220" height="32" class="box" fill="#f5f5f5" stroke="#999"/>
  <text x="610" y="377" text-anchor="middle" class="sublabel">listCalendars() / listEvents() / ...</text>

  <!-- Shared bottom label -->
  <text x="390" y="412" text-anchor="middle" class="sublabel">Same SPI shape, different delegation strategy</text>
</svg>
