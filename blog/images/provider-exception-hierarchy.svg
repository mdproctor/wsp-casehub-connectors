<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <style>
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 1.5; rx: 6; }
    .box-base { fill: #e9ecef; stroke: #343a40; stroke-width: 2; rx: 6; }
    .box-leaf { fill: #fff; stroke: #495057; stroke-width: 1.5; rx: 6; }
    .label { font-weight: 600; fill: #212529; }
    .detail { fill: #495057; font-size: 11; }
    .line { stroke: #868e96; stroke-width: 1.5; fill: none; }
    .arrow { fill: #868e96; }
    .enum-box { fill: #fff3cd; stroke: #856404; stroke-width: 1; rx: 4; }
    .enum-label { fill: #856404; font-size: 11; font-weight: 600; }
    .status { fill: #6c757d; font-size: 10; }
  </style>

  <!-- RuntimeException -->
  <rect x="240" y="10" width="200" height="36" class="box"/>
  <text x="340" y="33" text-anchor="middle" class="label">RuntimeException</text>

  <!-- Arrow down -->
  <line x1="340" y1="46" x2="340" y2="70" class="line"/>
  <polygon points="336,66 340,74 344,66" class="arrow"/>

  <!-- ProviderApiException -->
  <rect x="195" y="74" width="290" height="52" class="box-base"/>
  <text x="340" y="95" text-anchor="middle" class="label">ProviderApiException</text>
  <text x="340" y="115" text-anchor="middle" class="detail">statusCode · responseBody · provider</text>

  <!-- Branches -->
  <!-- Left: RateLimited -->
  <line x1="260" y1="126" x2="260" y2="150" class="line"/>
  <line x1="260" y1="150" x2="110" y2="150" class="line"/>
  <line x1="110" y1="150" x2="110" y2="170" class="line"/>
  <polygon points="106,166 110,174 114,166" class="arrow"/>

  <rect x="15" y="174" width="190" height="52" class="box-leaf"/>
  <text x="110" y="195" text-anchor="middle" class="label">ProviderRateLimitedException</text>
  <text x="110" y="215" text-anchor="middle" class="detail">retryAfterSeconds</text>
  <text x="110" y="235" text-anchor="middle" class="status">429</text>

  <!-- Center: Auth -->
  <line x1="340" y1="126" x2="340" y2="170" class="line"/>
  <polygon points="336,166 340,174 344,166" class="arrow"/>

  <rect x="245" y="174" width="190" height="52" class="box-leaf"/>
  <text x="340" y="195" text-anchor="middle" class="label">ProviderAuthException</text>
  <text x="340" y="215" text-anchor="middle" class="detail">reason: AuthFailureReason</text>
  <text x="340" y="235" text-anchor="middle" class="status">401 · 403</text>

  <!-- Right: SyncTokenExpired -->
  <line x1="420" y1="126" x2="420" y2="150" class="line"/>
  <line x1="420" y1="150" x2="570" y2="150" class="line"/>
  <line x1="570" y1="150" x2="570" y2="170" class="line"/>
  <polygon points="566,166 570,174 574,166" class="arrow"/>

  <rect x="475" y="174" width="190" height="52" class="box-leaf"/>
  <text x="570" y="195" text-anchor="middle" class="label">SyncTokenExpiredException</text>
  <text x="570" y="215" text-anchor="middle" class="detail">expiredToken</text>
  <text x="570" y="235" text-anchor="middle" class="status">410</text>

  <!-- AuthFailureReason enum -->
  <line x1="340" y1="226" x2="340" y2="260" class="line" stroke-dasharray="4,3"/>
  <polygon points="336,256 340,264 344,256" class="arrow"/>

  <rect x="235" y="268" width="210" height="60" class="enum-box"/>
  <text x="340" y="287" text-anchor="middle" class="enum-label">AuthFailureReason</text>
  <text x="340" y="303" text-anchor="middle" class="detail">TOKEN_EXPIRED → 401 (auto-refresh)</text>
  <text x="340" y="317" text-anchor="middle" class="detail">INSUFFICIENT_SCOPE → 403 (re-consent)</text>
  <text x="340" y="331" text-anchor="middle" class="detail">FORBIDDEN → 403 (not recoverable)</text>
</svg>
