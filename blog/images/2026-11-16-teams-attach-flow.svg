<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="290" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Teams file attach — upload first, reference second</text>

  <!-- Step 1: Caller -->
  <rect x="20" y="50" width="130" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="70" text-anchor="middle" font-weight="500" fill="#334155">ChatPlatform</text>
  <text x="85" y="86" text-anchor="middle" font-size="11" fill="#64748b">.send(content)</text>

  <!-- Arrow 1 to filesFolder -->
  <line x1="150" y1="72" x2="192" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="171" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">1</text>

  <!-- Step 2: filesFolder -->
  <rect x="194" y="50" width="150" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="269" y="70" text-anchor="middle" font-weight="500" fill="#1e40af">GET filesFolder</text>
  <text x="269" y="86" text-anchor="middle" font-size="11" fill="#3b82f6">→ driveId, folderId</text>

  <!-- Arrow 2 to upload -->
  <line x1="344" y1="72" x2="386" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">2</text>

  <!-- Step 3: Upload -->
  <rect x="388" y="50" width="170" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="473" y="70" text-anchor="middle" font-weight="500" fill="#1e40af">PUT /drives/…/content</text>
  <text x="473" y="86" text-anchor="middle" font-size="11" fill="#3b82f6">→ webUrl (SharePoint)</text>

  <!-- Arrow 3 to UploadedRef -->
  <line x1="558" y1="72" x2="600" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="579" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">3</text>

  <!-- Step 4: UploadedRef -->
  <rect x="602" y="50" width="138" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="671" y="70" text-anchor="middle" font-weight="500" fill="#166534">UploadedRef</text>
  <text x="671" y="86" text-anchor="middle" font-size="11" fill="#16a34a">(name, webUrl)</text>

  <!-- Arrow from UploadedRef down to mapper -->
  <line x1="671" y1="94" x2="671" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="130" font-size="10" fill="#94a3b8">4</text>

  <!-- Step 5: Mapper -->
  <rect x="460" y="150" width="210" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565" y="171" text-anchor="middle" font-weight="500" fill="#92400e">TeamsMapper.toMessageBody</text>
  <text x="565" y="187" text-anchor="middle" font-size="11" fill="#b45309">(content, [UploadedRef])</text>
  <text x="565" y="200" text-anchor="middle" font-size="10" fill="#b45309">contentType: "reference"</text>

  <!-- Arrow from ChatPlatform down to mapper -->
  <line x1="85" y1="94" x2="85" y2="178" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="85" y1="178" x2="458" y2="178" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow from mapper down to POST -->
  <line x1="565" y1="206" x2="565" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="574" y="232" font-size="10" fill="#94a3b8">5</text>

  <!-- Step 6: POST message -->
  <rect x="460" y="242" width="210" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="565" y="258" text-anchor="middle" font-weight="500" fill="#5b21b6">POST /teams/…/messages</text>
  <text x="565" y="273" text-anchor="middle" font-size="11" fill="#7c3aed">message + reference attachment</text>

  <!-- Note: simple vs resumable -->
  <rect x="20" y="150" width="230" height="60" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="135" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Upload path (step 2)</text>
  <text x="30" y="185" font-size="11" fill="#64748b">≤ 4 MB: simple PUT, auth in header</text>
  <text x="30" y="200" font-size="11" fill="#64748b">&gt; 4 MB: createUploadSession → chunks</text>
  <text x="30" y="213" font-size="11" fill="#f97316">  (chunks: no Authorization header)</text>
</svg>
