<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Invoke Activity Flow — Response Construction</text>

  <!-- Teams Cloud -->
  <rect x="20" y="55" width="110" height="50" rx="6" fill="#5b21b6" opacity="0.12" stroke="#5b21b6" stroke-width="1"/>
  <text x="75" y="76" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">Teams Client</text>
  <text x="75" y="92" text-anchor="middle" font-size="9" fill="#6b7280">Card Action</text>

  <!-- Arrow: Teams → Connector -->
  <line x1="130" y1="80" x2="175" y2="80" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="152" y="72" text-anchor="middle" font-size="8" fill="#6b7280">POST</text>

  <!-- Connector box -->
  <rect x="180" y="50" width="160" height="300" rx="6" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#6b7280">TeamsInboundConnector</text>

  <!-- JWT Auth -->
  <rect x="195" y="80" width="130" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="260" y="100" text-anchor="middle" font-size="10" fill="#92400e">JWT Validation</text>

  <!-- Activity Switch -->
  <rect x="195" y="125" width="130" height="32" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="260" y="145" text-anchor="middle" font-size="10" fill="#3730a3">type switch</text>

  <!-- Arrow down from auth to switch -->
  <line x1="260" y1="112" x2="260" y2="125" stroke="#374151" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- handleInvoke -->
  <rect x="195" y="170" width="130" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="260" y="190" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">handleInvoke</text>

  <!-- Arrow from switch to handleInvoke -->
  <line x1="260" y1="157" x2="260" y2="170" stroke="#374151" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="310" y="166" font-size="8" fill="#6b7280">"invoke"</text>

  <!-- InboundMessage output -->
  <rect x="195" y="215" width="130" height="28" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="260" y="233" text-anchor="middle" font-size="9" fill="#065f46">InboundMessage (always)</text>

  <!-- Arrow from handleInvoke to InboundMessage -->
  <line x1="260" y1="202" x2="260" y2="215" stroke="#374151" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrow from handleInvoke to InvokeService -->
  <line x1="325" y1="186" x2="380" y2="186" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <text x="352" y="180" text-anchor="middle" font-size="8" fill="#2563eb">dispatch</text>

  <!-- InvokeService box -->
  <rect x="385" y="55" width="150" height="200" rx="6" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="73" text-anchor="middle" font-size="10" font-weight="500" fill="#6b7280">InvokeService</text>

  <!-- Handler lookup -->
  <rect x="400" y="82" width="120" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="460" y="100" text-anchor="middle" font-size="9" fill="#374151">handler lookup</text>

  <!-- Handler found -->
  <rect x="400" y="122" width="120" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="460" y="140" text-anchor="middle" font-size="9" fill="#5b21b6">InvokeHandler</text>

  <!-- No handler -->
  <rect x="400" y="162" width="120" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="460" y="180" text-anchor="middle" font-size="9" fill="#92400e">→ Accepted()</text>

  <!-- Handler returns InvokeResponse -->
  <rect x="400" y="205" width="120" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="460" y="223" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">InvokeResponse</text>

  <!-- Arrow from handler to response -->
  <line x1="460" y1="150" x2="460" y2="162" stroke="#374151" stroke-width="0.8"/>
  <line x1="460" y1="190" x2="460" y2="205" stroke="#374151" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Arrow from InvokeResponse back to serializer -->
  <line x1="400" y1="219" x2="340" y2="260" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <!-- Serializer -->
  <rect x="195" y="255" width="130" height="32" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="260" y="270" text-anchor="middle" font-size="9" fill="#9d174d">InvokeResponse</text>
  <text x="260" y="282" text-anchor="middle" font-size="9" fill="#9d174d">Serializer</text>

  <!-- WebhookResult.Responded -->
  <rect x="195" y="300" width="130" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="315" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">WebhookResult</text>
  <text x="260" y="327" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">.Responded</text>

  <!-- Arrow from serializer to Responded -->
  <line x1="260" y1="287" x2="260" y2="300" stroke="#374151" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Responded components -->
  <rect x="560" y="290" width="140" height="75" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="630" y="308" text-anchor="middle" font-size="9" font-weight="500" fill="#166534">Responded carries:</text>
  <text x="630" y="324" text-anchor="middle" font-size="9" fill="#374151">responseBody (JSON)</text>
  <text x="630" y="338" text-anchor="middle" font-size="9" fill="#374151">contentType</text>
  <text x="630" y="352" text-anchor="middle" font-size="9" fill="#374151">messages (List)</text>

  <!-- Arrow from Responded to components -->
  <line x1="325" y1="316" x2="555" y2="316" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Response variants on the right -->
  <text x="590" y="73" font-size="10" font-weight="500" fill="#374151">InvokeResponse variants:</text>
  <text x="590" y="92" font-size="9" fill="#374151">• Accepted → {"statusCode":200}</text>
  <text x="590" y="107" font-size="9" fill="#374151">• CardUpdate → card JSON</text>
  <text x="590" y="122" font-size="9" fill="#374151">• Message → text response</text>
  <text x="590" y="137" font-size="9" fill="#374151">• TaskModuleContinue</text>
  <text x="590" y="152" font-size="9" fill="#374151">• TaskModuleMessage</text>
  <text x="590" y="167" font-size="9" fill="#374151">• Error → status + message</text>

  <!-- Arrow: Responded back to Teams -->
  <line x1="195" y1="332" x2="75" y2="332" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="75" y1="332" x2="75" y2="110" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="130" y="387" text-anchor="middle" font-size="8" fill="#166534">HTTP 200 + response body</text>
  <text x="130" y="397" text-anchor="middle" font-size="8" fill="#166534">+ InboundMessages delivered</text>
</svg>
