<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="240" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Streaming Plugin Pipeline — YAML → PluginScanner → StreamingStep</text>

  <!-- YAML file -->
  <rect x="20" y="60" width="120" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="82" text-anchor="middle" font-weight="500" fill="#334155">pipeline.yaml</text>
  <text x="80" y="98" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">stt-transcribe:</text>
  <text x="80" y="112" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">  language: en</text>

  <!-- Arrow -->
  <line x1="140" y1="90" x2="168" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Walker -->
  <rect x="170" y="65" width="100" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="220" y="88" text-anchor="middle" font-weight="500" fill="#1e40af">Walker</text>
  <text x="220" y="103" text-anchor="middle" font-size="11" fill="#3b82f6">resolve()</text>

  <!-- Arrow -->
  <line x1="270" y1="90" x2="298" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PluginRegistry -->
  <rect x="300" y="65" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="360" y="85" text-anchor="middle" font-weight="500" fill="#92400e">PluginRegistry</text>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#b45309">Definition</text>

  <!-- Arrow -->
  <line x1="420" y1="90" x2="448" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- StreamingStepFactory -->
  <rect x="450" y="60" width="130" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="515" y="82" text-anchor="middle" font-weight="500" fill="#5b21b6">StepFactory</text>
  <text x="515" y="97" text-anchor="middle" font-size="11" fill="#7c3aed">create(params,</text>
  <text x="515" y="110" text-anchor="middle" font-size="11" fill="#7c3aed">services)</text>

  <!-- Arrow -->
  <line x1="580" y1="90" x2="608" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- StreamingStep -->
  <rect x="610" y="65" width="90" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="655" y="85" text-anchor="middle" font-weight="500" fill="#166534">Streaming</text>
  <text x="655" y="100" text-anchor="middle" font-weight="500" fill="#166534">Step</text>

  <!-- Data flow below -->
  <rect x="80" y="155" width="100" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#991b1b">TTS</text>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#dc2626">text → WAV</text>

  <line x1="180" y1="175" x2="248" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="215" y="168" text-anchor="middle" font-size="11" fill="#64748b">byte[]</text>

  <rect x="250" y="155" width="200" height="40" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="#166534">StreamingStep&lt;byte[], TranscriptionResult&gt;</text>
  <text x="350" y="186" text-anchor="middle" font-size="11" fill="#16a34a">stt-transcribe: language=en</text>

  <line x1="450" y1="175" x2="518" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="484" y="168" text-anchor="middle" font-size="11" fill="#64748b">result</text>

  <rect x="520" y="155" width="170" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="605" y="172" text-anchor="middle" font-size="12" fill="#1e40af">TranscriptionResult</text>
  <text x="605" y="186" text-anchor="middle" font-size="11" fill="#3b82f6">.text .language .confidence</text>

  <!-- Labels -->
  <text x="360" y="225" text-anchor="middle" font-size="11" fill="#94a3b8">Real TTS produces audio → StreamingStep transcribes → structured result</text>
</svg>
