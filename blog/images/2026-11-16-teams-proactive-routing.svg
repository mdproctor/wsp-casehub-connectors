<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#059669"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Proactive Messaging — Three-Way Routing</text>

  <!-- TeamsChatPlatform box -->
  <rect x="280" y="50" width="220" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" font-weight="600" fill="#334155">sendMessage(channel, content)</text>
  <text x="390" y="88" text-anchor="middle" font-size="11" fill="#64748b">TeamsChatPlatform</text>

  <!-- Arrow from platform to decision -->
  <line x1="390" y1="100" x2="390" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="390,130 470,175 390,220 310,175" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="172" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">channel.id()</text>
  <text x="390" y="186" text-anchor="middle" font-size="11" fill="#92400e">prefix?</text>

  <!-- Left branch: personal: -->
  <text x="275" y="160" text-anchor="end" font-size="12" font-weight="500" fill="#7c3aed">personal:</text>
  <line x1="310" y1="175" x2="155" y2="175" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Centre branch: user: (down) -->
  <text x="390" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#059669">user:</text>
  <line x1="390" y1="220" x2="390" y2="258" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Right branch: teamId:channelId -->
  <text x="505" y="160" text-anchor="start" font-size="12" font-weight="500" fill="#2563eb">teamId:channelId</text>
  <line x1="470" y1="175" x2="615" y2="175" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Bot Framework box (personal) -->
  <rect x="30" y="150" width="125" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="92" y="172" text-anchor="middle" font-weight="600" font-size="12" fill="#5b21b6">sendToConversation</text>
  <text x="92" y="187" text-anchor="middle" font-size="10" fill="#6d28d9">known conv ID</text>

  <!-- Graph API box -->
  <rect x="615" y="150" width="140" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="685" y="172" text-anchor="middle" font-weight="600" font-size="12" fill="#1e40af">TeamsClient</text>
  <text x="685" y="187" text-anchor="middle" font-size="11" fill="#2563eb">(Graph API)</text>

  <!-- Proactive path: store check -->
  <rect x="290" y="258" width="200" height="45" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" font-weight="600" font-size="12" fill="#047857">ConversationReferenceStore</text>
  <text x="390" y="293" text-anchor="middle" font-size="10" fill="#059669">find(aadObjectId)</text>

  <!-- Store hit arrow (left) -->
  <text x="262" y="275" text-anchor="end" font-size="11" font-weight="500" fill="#7c3aed">hit</text>
  <line x1="290" y1="280" x2="155" y2="280" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr-purple)"/>
  <!-- Connect to personal box (dashed down from that arrow) -->
  <line x1="92" y1="200" x2="92" y2="265" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6,3"/>
  <line x1="92" y1="265" x2="155" y2="280" stroke="#7c3aed" stroke-width="0" />

  <!-- Store miss arrow (down) -->
  <text x="415" y="320" text-anchor="start" font-size="11" font-weight="500" fill="#d97706">miss</text>
  <line x1="390" y1="303" x2="390" y2="340" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- createConversation box -->
  <rect x="290" y="340" width="200" height="45" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="360" text-anchor="middle" font-weight="600" font-size="12" fill="#92400e">createConversation</text>
  <text x="390" y="375" text-anchor="middle" font-size="10" fill="#b45309">POST /v3/conversations</text>

  <!-- Arrow from create to store (store the new ref) -->
  <line x1="490" y1="362" x2="550" y2="362" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="560" y="358" text-anchor="start" font-size="10" fill="#059669">store</text>
  <line x1="550" y1="362" x2="550" y2="290" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="550" y1="290" x2="492" y2="290" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Arrow from create to sendToConversation -->
  <line x1="290" y1="362" x2="92" y2="362" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <line x1="92" y1="280" x2="92" y2="362" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="195" y="355" text-anchor="middle" font-size="10" fill="#7c3aed">then send</text>

  <!-- Inbound capture -->
  <rect x="30" y="395" width="720" height="35" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="390" y="416" text-anchor="middle" font-size="12" fill="#166534">conversationUpdate activity → ConversationReferenceStore.store() + InboundMessage CDI event</text>
</svg>
