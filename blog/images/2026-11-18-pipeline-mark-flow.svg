<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="gYaml" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gPlugin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gEngine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Pipeline Mark Timing — Data Flow</text>

  <!-- YAML Playbook -->
  <rect x="16" y="50" width="130" height="80" rx="6" fill="url(#gYaml)"/>
  <text x="81" y="74" text-anchor="middle" font-size="12" fill="white" font-weight="600">YAML Playbook</text>
  <text x="81" y="92" text-anchor="middle" font-size="10" fill="#ede9fe">marks:</text>
  <text x="81" y="105" text-anchor="middle" font-size="9" fill="#ede9fe">- {id: w1, charOffset: 0}</text>
  <text x="81" y="117" text-anchor="middle" font-size="9" fill="#ede9fe">- {id: w2, charOffset: 6}</text>

  <!-- Arrow -->
  <line x1="146" y1="90" x2="178" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TtsSynthesisePlugin -->
  <rect x="186" y="50" width="150" height="80" rx="6" fill="url(#gPlugin)"/>
  <text x="261" y="72" text-anchor="middle" font-size="11" fill="white" font-weight="600">TtsSynthesisePlugin</text>
  <text x="261" y="88" text-anchor="middle" font-size="10" fill="#dbeafe">@Optional List&lt;TextMark&gt;</text>
  <text x="261" y="104" text-anchor="middle" font-size="9" fill="#93c5fd">passes marks through</text>
  <text x="261" y="117" text-anchor="middle" font-size="9" fill="#93c5fd">to SynthesisOptions</text>

  <!-- Arrow -->
  <line x1="336" y1="90" x2="368" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SynthesisOptions -->
  <rect x="376" y="50" width="130" height="80" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="441" y="72" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">SynthesisOptions</text>
  <text x="441" y="90" text-anchor="middle" font-size="10" fill="#475569">voice, language</text>
  <text x="441" y="105" text-anchor="middle" font-size="10" fill="#475569">audioFormat</text>
  <text x="441" y="120" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">marks: List&lt;TextMark&gt;</text>

  <!-- Arrow -->
  <line x1="506" y1="90" x2="538" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TTS Engine -->
  <rect x="546" y="50" width="156" height="80" rx="6" fill="url(#gEngine)"/>
  <text x="624" y="72" text-anchor="middle" font-size="11" fill="white" font-weight="600">TextToSpeech</text>
  <text x="624" y="90" text-anchor="middle" font-size="10" fill="#d1fae5">synthesise(text, options)</text>
  <text x="624" y="106" text-anchor="middle" font-size="9" fill="#a7f3d0">computes time offsets</text>
  <text x="624" y="119" text-anchor="middle" font-size="9" fill="#a7f3d0">for each TextMark</text>

  <!-- Arrow down from engine -->
  <line x1="624" y1="130" x2="624" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SynthesisResult -->
  <rect x="496" y="170" width="256" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="624" y="192" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">SynthesisResult</text>
  <text x="624" y="210" text-anchor="middle" font-size="10" fill="#475569">audioData, audioFormat</text>
  <text x="624" y="226" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">marks: [{id: "w1", offsetMs: 0}, {id: "w2", offsetMs: 523}]</text>

  <!-- Arrow back to left -->
  <line x1="496" y1="205" x2="97" y2="205" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Client label -->
  <rect x="16" y="186" width="130" height="38" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="81" y="206" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">Avatar / Client</text>
  <text x="81" y="219" text-anchor="middle" font-size="9" fill="#92400e">gesture scheduling</text>

  <!-- Gap label -->
  <text x="261" y="156" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">← previously sealed off →</text>
  <text x="261" y="170" text-anchor="middle" font-size="9" fill="#6b7280">#320 added the marks field</text>
</svg>
