<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">VITS Guarded-Exact Mark Resolution</text>

  <!-- Text input -->
  <rect x="40" y="44" width="640" height="36" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="67" font-size="13" fill="#334155" font-weight="500">Input text:</text>
  <text x="145" y="67" font-size="14" fill="#1e293b" font-family="'SF Mono', 'Fira Code', monospace">"hello world"</text>
  <text x="400" y="67" font-size="13" fill="#334155" font-weight="500">Mark at charOffset 6:</text>
  <text x="560" y="67" font-size="14" fill="#059669" font-family="'SF Mono', 'Fira Code', monospace">"world"</text>

  <!-- Step 1: Phonemise prefix -->
  <rect x="40" y="100" width="300" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="55" y="120" font-size="11" fill="#1e40af" font-weight="600">1. Phonemise prefix "hello "</text>
  <text x="55" y="140" font-size="12" fill="#1e293b" font-family="'SF Mono', 'Fira Code', monospace">espeak → "hɛˈloʊ"</text>
  <text x="55" y="158" font-size="12" fill="#334155">IPA words: <tspan font-weight="600" fill="#1e40af">1</tspan></text>

  <!-- Step 2: Phonemise suffix -->
  <rect x="380" y="100" width="300" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="395" y="120" font-size="11" fill="#1e40af" font-weight="600">2. Phonemise suffix "world"</text>
  <text x="395" y="140" font-size="12" fill="#1e293b" font-family="'SF Mono', 'Fira Code', monospace">espeak → "wɜːld"</text>
  <text x="395" y="158" font-size="12" fill="#334155">IPA words: <tspan font-weight="600" fill="#1e40af">1</tspan></text>

  <!-- Step 3: Count space tokens -->
  <rect x="40" y="192" width="640" height="70" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="55" y="212" font-size="11" fill="#854d0e" font-weight="600">3. VITS token sequence (interspersed with pad tokens)</text>
  <text x="55" y="234" font-size="11" fill="#1e293b" font-family="'SF Mono', 'Fira Code', monospace">_ ^ _ h _ ɛ _ ˈ _ l _ oʊ _ <tspan fill="#dc2626" font-weight="700">⎵</tspan> _ w _ ɜː _ l _ d _ $ _</text>
  <text x="55" y="252" font-size="12" fill="#334155">Space tokens: <tspan font-weight="600" fill="#854d0e">1</tspan>  →  Word onset times from duration output</text>

  <!-- Guard check -->
  <polygon points="360,290 460,328 360,366 260,328" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">Guard check</text>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#991b1b">1 + 1 == 1 + 1 ?</text>

  <!-- Guard formula label -->
  <text x="360" y="282" text-anchor="middle" font-size="11" fill="#6b7280">prefixWords + suffixWords == spaceTokens + 1</text>

  <!-- Pass branch -->
  <line x1="460" y1="328" x2="570" y2="328" stroke="#059669" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="508" y="320" text-anchor="middle" font-size="11" fill="#059669" font-weight="600">pass</text>
  <rect x="578" y="304" width="102" height="48" rx="6" fill="#059669"/>
  <text x="629" y="325" text-anchor="middle" font-size="12" fill="white" font-weight="600">Exact</text>
  <text x="629" y="342" text-anchor="middle" font-size="10" fill="#d1fae5">word onset time</text>

  <!-- Fail branch -->
  <line x1="260" y1="328" x2="150" y2="328" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="212" y="320" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">fail</text>
  <rect x="40" y="304" width="102" height="48" rx="6" fill="#dc2626"/>
  <text x="91" y="325" text-anchor="middle" font-size="12" fill="white" font-weight="600">Fallback</text>
  <text x="91" y="342" text-anchor="middle" font-size="10" fill="#fecaca">Tier 2 or 3</text>

  <!-- Monotonicity check -->
  <line x1="629" y1="352" x2="629" y2="385" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="558" y="390" width="142" height="36" rx="5" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="629" y="413" text-anchor="middle" font-size="11" fill="#166534">verify monotonic offsets</text>

  <!-- Explanation -->
  <text x="40" y="450" font-size="10" fill="#6b7280" font-style="italic">Guard catches: espeak function-word joining, number expansion, context-dependent phonemisation, clause-join spaces</text>
  <text x="40" y="466" font-size="10" fill="#6b7280" font-style="italic">If guard fails → empty marks → MarkTimingEnricher provides Tier 2 (phoneme-proportional) or Tier 3 (character-proportional)</text>
</svg>
