<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Signal box -->
  <rect x="40" y="40" width="180" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="65" text-anchor="middle" font-weight="600" fill="#0f172a">Signal</text>
  <text x="130" y="85" text-anchor="middle" font-size="11" fill="#64748b">requires: sms[receive]</text>
  <text x="130" y="102" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">"verification code"</text>

  <!-- Arrow: Signal → DependencyResolver -->
  <line x1="220" y1="80" x2="290" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="255" y="72" text-anchor="middle" font-size="10" fill="#64748b">needs</text>

  <!-- DependencyResolver box -->
  <rect x="295" y="30" width="180" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="385" y="55" text-anchor="middle" font-weight="600" fill="#1e40af">DependencyResolver</text>
  <text x="385" y="78" text-anchor="middle" font-size="11" fill="#3b82f6">capability: sms</text>
  <text x="385" y="95" text-anchor="middle" font-size="11" fill="#3b82f6">sub: [receive]</text>
  <text x="385" y="112" text-anchor="middle" font-size="10" fill="#64748b">who provides this?</text>

  <!-- Arrow: Resolver → Numbrrs -->
  <line x1="475" y1="60" x2="530" y2="60" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="503" y="52" text-anchor="middle" font-size="10" fill="#16a34a">match</text>

  <!-- Numbrrs box -->
  <rect x="535" y="30" width="160" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="55" text-anchor="middle" font-weight="600" fill="#166534">Numbrrs</text>
  <text x="615" y="75" text-anchor="middle" font-size="11" fill="#16a34a">provides: sms[receive]</text>
  <text x="615" y="92" text-anchor="middle" font-size="10" fill="#94a3b8">status: UNCONFIGURED</text>

  <!-- Arrow: Resolver → Manual -->
  <line x1="475" y1="100" x2="530" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="520" y="125" text-anchor="middle" font-size="10" fill="#64748b">fallback</text>

  <!-- Manual option box -->
  <rect x="535" y="140" width="160" height="60" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="615" y="165" text-anchor="middle" font-weight="600" fill="#854d0e">Manual</text>
  <text x="615" y="183" text-anchor="middle" font-size="11" fill="#ca8a04">user provides number</text>

  <!-- Resolution options label -->
  <text x="385" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Resolution Options</text>

  <!-- Before/After comparison -->
  <rect x="40" y="220" width="300" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="55" y="242" font-size="11" fill="#991b1b" font-weight="600">Before (playbook)</text>
  <text x="55" y="260" font-size="11" fill="#991b1b" font-family="monospace">connector-status:</text>
  <text x="55" y="276" font-size="11" fill="#991b1b" font-family="monospace">  connector-id: numbrrs ✗</text>

  <rect x="380" y="220" width="300" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="395" y="242" font-size="11" fill="#166534" font-weight="600">After (manifest)</text>
  <text x="395" y="260" font-size="11" fill="#166534" font-family="monospace">require-capability:</text>
  <text x="395" y="276" font-size="11" fill="#166534" font-family="monospace">  capability: sms[receive] ✓</text>
</svg>
