<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Teams Outbound — Dual API Routing</text>

  <!-- TeamsChatPlatform box -->
  <rect x="240" y="50" width="240" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="72" text-anchor="middle" font-weight="600" fill="#334155">TeamsChatPlatform</text>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#64748b">sendMessage / replyToMessage</text>

  <!-- Decision diamond -->
  <polygon points="360,130 430,170 360,210 290,170" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="167" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">channel.id()</text>
  <text x="360" y="181" text-anchor="middle" font-size="11" fill="#92400e">prefix?</text>

  <!-- Arrow from platform to decision -->
  <line x1="360" y1="100" x2="360" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Left branch: personal: -->
  <text x="265" y="160" text-anchor="end" font-size="12" font-weight="500" fill="#7c3aed">personal:</text>
  <line x1="290" y1="170" x2="140" y2="170" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Right branch: teamId:channelId -->
  <text x="455" y="160" text-anchor="start" font-size="12" font-weight="500" fill="#2563eb">teamId:channelId</text>
  <line x1="430" y1="170" x2="580" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Bot Framework Client box -->
  <rect x="20" y="145" width="120" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="80" y="167" text-anchor="middle" font-weight="600" font-size="12" fill="#5b21b6">BotFramework</text>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#6d28d9">Client</text>

  <!-- Graph API Client box -->
  <rect x="580" y="145" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="167" text-anchor="middle" font-weight="600" font-size="12" fill="#1e40af">TeamsClient</text>
  <text x="640" y="182" text-anchor="middle" font-size="11" fill="#2563eb">(Graph API)</text>

  <!-- Bot Framework methods -->
  <line x1="80" y1="195" x2="80" y2="230" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="10" y="230" width="140" height="80" rx="5" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="80" y="250" text-anchor="middle" font-size="11" fill="#5b21b6">sendToConversation()</text>
  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#5b21b6">replyToActivity()</text>
  <text x="80" y="292" text-anchor="middle" font-size="10" fill="#8b5cf6">REST v3 + Bot token</text>

  <!-- Graph API methods -->
  <line x1="640" y1="195" x2="640" y2="230" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="560" y="230" width="150" height="80" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="635" y="250" text-anchor="middle" font-size="11" fill="#1e40af">sendMessage()</text>
  <text x="635" y="268" text-anchor="middle" font-size="11" fill="#1e40af">setReaction() / getMessage()</text>
  <text x="635" y="292" text-anchor="middle" font-size="10" fill="#3b82f6">Graph v1.0 + App token</text>

  <!-- Inbound flow -->
  <text x="360" y="345" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Inbound Pipeline</text>

  <!-- Three inbound boxes -->
  <rect x="30" y="362" width="180" height="45" rx="5" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="120" y="381" text-anchor="middle" font-weight="500" font-size="12" fill="#991b1b">Bot Framework Webhook</text>
  <text x="120" y="396" text-anchor="middle" font-size="10" fill="#dc2626">activity JSON + attachments</text>

  <rect x="260" y="362" width="200" height="45" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="360" y="381" text-anchor="middle" font-weight="500" font-size="12" fill="#166534">TeamsInboundTranslator</text>
  <text x="360" y="396" text-anchor="middle" font-size="10" fill="#16a34a">HTML → markdown + plain text</text>

  <rect x="510" y="362" width="180" height="45" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="381" text-anchor="middle" font-weight="500" font-size="12" fill="#334155">ChatContent</text>
  <text x="600" y="396" text-anchor="middle" font-size="10" fill="#64748b">text + markdown + attachments</text>

  <!-- Inbound arrows -->
  <line x1="210" y1="385" x2="258" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="385" x2="508" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>