<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Spring Boot Auto-Configuration for @AgentService</text>

  <!-- Compile time section -->
  <rect x="20" y="44" width="320" height="130" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" letter-spacing="1">COMPILE TIME</text>

  <!-- @AgentService interface -->
  <rect x="40" y="76" width="130" height="44" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="96" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">@AgentService</text>
  <text x="105" y="110" text-anchor="middle" fill="#4b5563" font-size="11">Coach</text>

  <!-- APT Processor -->
  <rect x="195" y="76" width="130" height="44" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="96" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">APT Processor</text>
  <text x="260" y="110" text-anchor="middle" fill="#4b5563" font-size="11">generates proxy</text>

  <!-- Proxy class -->
  <rect x="100" y="132" width="140" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="154" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">CoachProxy.class</text>

  <!-- Arrows compile time -->
  <line x1="170" y1="98" x2="193" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="122" x2="210" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Runtime section -->
  <rect x="380" y="44" width="320" height="280" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="540" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af" letter-spacing="1">RUNTIME (SPRING BOOT)</text>

  <!-- AutoConfiguration -->
  <rect x="400" y="76" width="280" height="38" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">AgentServiceAutoConfiguration</text>

  <!-- Registrar -->
  <rect x="400" y="128" width="280" height="38" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="152" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">AgentServiceBeanRegistrar</text>

  <!-- Steps inside registrar -->
  <rect x="410" y="180" width="122" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="471" y="200" text-anchor="middle" fill="#1e40af" font-size="11">scan packages</text>

  <rect x="548" y="180" width="122" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="609" y="200" text-anchor="middle" fill="#1e40af" font-size="11">find @AgentService</text>

  <!-- AgentServiceBeans -->
  <rect x="410" y="226" width="122" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="471" y="246" text-anchor="middle" fill="#1e40af" font-size="11">AgentServiceBeans</text>

  <!-- createProxy -->
  <rect x="548" y="226" width="122" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="609" y="246" text-anchor="middle" fill="#1e40af" font-size="11">createProxy(Coach)</text>

  <!-- Coach bean -->
  <rect x="460" y="274" width="160" height="36" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="296" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">Coach bean ✓</text>

  <!-- Arrows runtime -->
  <line x1="540" y1="114" x2="540" y2="126" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="540" y1="166" x2="471" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="533" y1="196" x2="546" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="609" y1="212" x2="609" y2="224" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="471" y1="212" x2="471" y2="224" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="609" y1="258" x2="570" y2="272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Bridge arrow from compile to runtime -->
  <line x1="240" y1="149" x2="378" y2="149" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="310" y="142" text-anchor="middle" fill="#64748b" font-size="10">on classpath</text>
</svg>
