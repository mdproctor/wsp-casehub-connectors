<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <style>
      .box { stroke: #374151; stroke-width: 1.5; rx: 6; }
      .builder-zone { fill: #eff6ff; }
      .caller-zone { fill: #fef3c7; }
      .mixed-zone { fill: #fce7f3; }
      .label { font-weight: 600; font-size: 12; fill: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
      .field { font-size: 13; fill: #1f2937; }
      .field-key { font-weight: 600; }
      .zone-label { font-size: 11; fill: #9ca3af; font-style: italic; }
      .title { font-size: 15; font-weight: 700; fill: #111827; }
      .code { font-family: "SF Mono", "Menlo", monospace; font-size: 12; fill: #1f2937; }
    </style>
  </defs>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" class="title">button() — shape is protocol, values are caller-chosen</text>

  <!-- The button() method call -->
  <rect x="40" y="48" width="540" height="40" class="box mixed-zone"/>
  <text x="60" y="73" class="code">.button("openUrl", "View", "https://contoso.com/widget")</text>

  <!-- Arrow down -->
  <line x1="310" y1="88" x2="310" y2="110" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="306,108 310,116 314,108" fill="#6b7280"/>

  <!-- JSON output envelope — builder zone -->
  <rect x="40" y="120" width="540" height="190" class="box builder-zone"/>
  <text x="60" y="142" class="label">Builder owns this shape</text>

  <!-- buttons array structure -->
  <text x="60" y="168" class="field"><tspan class="field-key">"buttons":</tspan> [</text>

  <!-- Single button object -->
  <rect x="80" y="178" width="480" height="100" class="box caller-zone"/>
  <text x="100" y="198" class="zone-label">↓ caller provides these values</text>
  <text x="100" y="222" class="field"><tspan class="field-key">"type":</tspan>  "openUrl"</text>
  <text x="370" y="222" class="zone-label">← protocol vocabulary (string, not enum)</text>
  <text x="100" y="244" class="field"><tspan class="field-key">"title":</tspan> "View"</text>
  <text x="100" y="266" class="field"><tspan class="field-key">"value":</tspan> "https://contoso.com/widget"</text>

  <!-- Close brackets -->
  <text x="60" y="296" class="field">]</text>

  <!-- Legend -->
  <rect x="40" y="320" width="12" height="12" fill="#eff6ff" stroke="#374151" stroke-width="1" rx="2"/>
  <text x="58" y="331" class="zone-label" style="fill: #374151;">Protocol shape (builder handles)</text>
  <rect x="260" y="320" width="12" height="12" fill="#fef3c7" stroke="#374151" stroke-width="1" rx="2"/>
  <text x="278" y="331" class="zone-label" style="fill: #374151;">Caller values (passed as arguments)</text>
  <rect x="480" y="320" width="12" height="12" fill="#fce7f3" stroke="#374151" stroke-width="1" rx="2"/>
  <text x="498" y="331" class="zone-label" style="fill: #374151;">Both</text>
</svg>
