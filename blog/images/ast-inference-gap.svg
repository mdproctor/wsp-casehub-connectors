<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">What the Scanner Sees vs What Actually Happens</text>

  <!-- Top row: Visible chain (calendar domain — scanner can follow) -->
  <text x="20" y="68" font-size="11" font-weight="600" fill="#16a34a">Scanner can follow</text>
  <text x="20" y="83" font-size="10" fill="#6b7280">CalendarApi — direct SPI delegation</text>

  <rect x="20" y="94" width="140" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="90" y="116" text-anchor="middle" font-size="11" fill="#15803d">listEvents()</text>

  <line x1="160" y1="112" x2="210" y2="112" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="185" y="104" text-anchor="middle" font-size="9" fill="#16a34a">.platform()</text>

  <rect x="212" y="94" width="150" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="287" y="116" text-anchor="middle" font-size="11" fill="#15803d">CalendarPlatform</text>

  <line x1="362" y1="112" x2="412" y2="112" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="387" y="104" text-anchor="middle" font-size="9" fill="#16a34a">.list()</text>

  <rect x="414" y="94" width="130" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="479" y="116" text-anchor="middle" font-size="11" fill="#15803d">SPI method</text>

  <text x="580" y="116" font-size="10" fill="#16a34a">✓ AST traces the full chain</text>

  <!-- Bottom row: Invisible chain (voice domain — scanner loses the path) -->
  <text x="20" y="175" font-size="11" font-weight="600" fill="#dc2626">Scanner loses the path</text>
  <text x="20" y="190" font-size="10" fill="#6b7280">VoiceApi — routing through an intermediate service</text>

  <rect x="20" y="201" width="120" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="80" y="223" text-anchor="middle" font-size="11" fill="#dc2626">speak()</text>

  <line x1="140" y1="219" x2="190" y2="219" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="165" y="211" text-anchor="middle" font-size="8" fill="#dc2626">resolve()</text>

  <rect x="192" y="201" width="175" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="279" y="218" text-anchor="middle" font-size="10" fill="#dc2626">RoutingVoicePlatform</text>
  <text x="279" y="230" text-anchor="middle" font-size="10" fill="#dc2626">Service</text>

  <line x1="367" y1="219" x2="407" y2="219" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="387" y="211" text-anchor="middle" font-size="8" fill="#dc2626">?</text>

  <rect x="409" y="201" width="130" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="474" y="223" text-anchor="middle" font-size="11" fill="#dc2626">VoicePlatform</text>

  <text x="575" y="223" font-size="10" fill="#dc2626">✗ AST can't follow routing</text>

  <!-- Annotation bridge -->
  <rect x="145" y="272" width="430" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">@GeneratePlugin(spi = VoicePlatform.class)</text>
  <text x="360" y="307" text-anchor="middle" font-size="10" fill="#3b82f6">"I know where this goes — here's the metadata you need"</text>

  <line x1="360" y1="237" x2="360" y2="270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
