<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .box { rx: 6; ry: 6; }
      .title { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
      .subtitle { font-size: 11px; fill: #555; }
      .label { font-size: 10px; fill: #777; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Shared Graph Client → Four Platform SPIs</text>

  <!-- Graph Client (center) -->
  <rect x="250" y="50" width="220" height="80" class="box" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="360" y="75" text-anchor="middle" class="title">MicrosoftGraphClient</text>
  <text x="360" y="92" text-anchor="middle" class="subtitle">OData pagination · delta sync</text>
  <text x="360" y="106" text-anchor="middle" class="subtitle">GraphErrorHandler · TokenRetry</text>

  <!-- Graph API -->
  <rect x="270" y="148" width="180" height="32" class="box" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <text x="360" y="169" text-anchor="middle" class="subtitle">graph.microsoft.com/v1.0</text>
  <line x1="360" y1="130" x2="360" y2="148" class="arrow"/>

  <!-- Email Platform (left) -->
  <rect x="20" y="210" width="150" height="65" class="box" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="95" y="232" text-anchor="middle" class="title">email-microsoft</text>
  <text x="95" y="248" text-anchor="middle" class="subtitle">MicrosoftMailClient</text>
  <text x="95" y="262" text-anchor="middle" class="label">id: "microsoft"</text>

  <!-- Calendar Platform -->
  <rect x="190" y="210" width="150" height="65" class="box" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="265" y="232" text-anchor="middle" class="title">calendar-microsoft</text>
  <text x="265" y="248" text-anchor="middle" class="subtitle">MicrosoftCalendarClient</text>
  <text x="265" y="262" text-anchor="middle" class="label">id: "microsoft"</text>

  <!-- Document Platform -->
  <rect x="360" y="210" width="150" height="65" class="box" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="435" y="232" text-anchor="middle" class="title">document-microsoft</text>
  <text x="435" y="248" text-anchor="middle" class="subtitle">MicrosoftDriveClient</text>
  <text x="435" y="262" text-anchor="middle" class="label">basePath composition</text>

  <!-- Chat Platform (right) -->
  <rect x="530" y="210" width="170" height="65" class="box" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5"/>
  <text x="615" y="232" text-anchor="middle" class="title">chat-teams</text>
  <text x="615" y="248" text-anchor="middle" class="subtitle">TeamsClient</text>
  <text x="615" y="262" text-anchor="middle" class="label">dual token model</text>

  <!-- Arrows from modules to graph client -->
  <path d="M 95 210 L 95 160 Q 95 140 115 140 L 250 105" class="arrow"/>
  <path d="M 265 210 L 265 150 L 310 130" class="arrow"/>
  <path d="M 435 210 L 435 150 L 410 130" class="arrow"/>
  <path d="M 615 210 L 615 160 Q 615 140 595 140 L 470 105" class="arrow"/>

  <!-- Two CDI beans for document -->
  <rect x="355" y="295" width="75" height="40" class="box" fill="#fff" stroke="#ea4335" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="392" y="312" text-anchor="middle" class="label">OneDrive</text>
  <text x="392" y="324" text-anchor="middle" class="label">/me/drive</text>

  <rect x="440" y="295" width="75" height="40" class="box" fill="#fff" stroke="#ea4335" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="477" y="312" text-anchor="middle" class="label">SharePoint</text>
  <text x="477" y="324" text-anchor="middle" class="label">/sites/…/drive</text>

  <!-- Dual tokens for Teams -->
  <rect x="530" y="295" width="80" height="40" class="box" fill="#fff" stroke="#a142f4" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="570" y="312" text-anchor="middle" class="label">Delegated</text>
  <text x="570" y="324" text-anchor="middle" class="label">user context</text>

  <rect x="620" y="295" width="80" height="40" class="box" fill="#fff" stroke="#a142f4" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="660" y="312" text-anchor="middle" class="label">Application</text>
  <text x="660" y="324" text-anchor="middle" class="label">messaging</text>

  <!-- SPI labels at bottom -->
  <text x="95" y="365" text-anchor="middle" class="label">EmailPlatform SPI</text>
  <text x="265" y="365" text-anchor="middle" class="label">CalendarPlatform SPI</text>
  <text x="435" y="365" text-anchor="middle" class="label">DocumentPlatform SPI</text>
  <text x="615" y="365" text-anchor="middle" class="label">ChatPlatform SPI</text>

  <!-- SPI boxes -->
  <rect x="25" y="350" width="140" height="24" class="box" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="195" y="350" width="140" height="24" class="box" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="365" y="350" width="140" height="24" class="box" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="545" y="350" width="140" height="24" class="box" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>

  <!-- Connector lines to SPIs -->
  <line x1="95" y1="275" x2="95" y2="350" class="arrow dashed"/>
  <line x1="265" y1="275" x2="265" y2="350" class="arrow dashed"/>
  <line x1="435" y1="275" x2="435" y2="350" class="arrow dashed"/>
  <line x1="615" y1="275" x2="615" y2="350" class="arrow dashed"/>
</svg>
