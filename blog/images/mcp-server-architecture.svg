<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="718" height="418" rx="8" fill="#fafafa" stroke="#ddd"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">MCP Server — Single-Process Architecture</text>

  <!-- MCP Client box -->
  <rect x="20" y="60" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="90" y="82" text-anchor="middle" font-weight="600" fill="#1565c0">MCP Client</text>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#666">Claude / langchain4j</text>

  <!-- Arrow -->
  <line x1="160" y1="85" x2="210" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="78" text-anchor="middle" font-size="10" fill="#888">stdio / HTTP</text>

  <!-- Quarkus App -->
  <rect x="220" y="45" width="480" height="360" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="460" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Quarkus App (JVM or Native)</text>

  <!-- MCP Server layer -->
  <rect x="240" y="82" width="200" height="40" rx="4" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="340" y="107" text-anchor="middle" font-size="12" fill="#2e7d32">quarkus-mcp-server</text>

  <!-- Scanner + Registrar -->
  <rect x="460" y="82" width="220" height="40" rx="4" fill="#fff3e0" stroke="#ff9800"/>
  <text x="570" y="100" text-anchor="middle" font-size="11" fill="#e65100">GraphQLModelScanner</text>
  <text x="570" y="114" text-anchor="middle" font-size="11" fill="#e65100">DynamicToolRegistrar (flat)</text>

  <!-- Arrow from scanner to domains -->
  <line x1="570" y1="122" x2="570" y2="145" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Domain grid -->
  <rect x="240" y="150" width="440" height="120" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-dasharray="4,3"/>
  <text x="460" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#555">@McpDomain Beans (133 tools, 15 domains)</text>

  <rect x="255" y="182" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="300" y="200" text-anchor="middle" font-size="10" fill="#3949ab">chat (12)</text>

  <rect x="355" y="182" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#3949ab">calendar (7)</text>

  <rect x="455" y="182" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="500" y="200" text-anchor="middle" font-size="10" fill="#3949ab">bank (6)</text>

  <rect x="555" y="182" width="100" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="605" y="200" text-anchor="middle" font-size="10" fill="#3949ab">documents (11)</text>

  <rect x="255" y="218" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="300" y="236" text-anchor="middle" font-size="10" fill="#3949ab">email (4)</text>

  <rect x="355" y="218" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="400" y="236" text-anchor="middle" font-size="10" fill="#3949ab">commerce (12)</text>

  <rect x="455" y="218" width="90" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="500" y="236" text-anchor="middle" font-size="10" fill="#3949ab">travel (11)</text>

  <rect x="555" y="218" width="100" height="28" rx="3" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="605" y="236" text-anchor="middle" font-size="10" fill="#3949ab">+8 more...</text>

  <!-- Providers -->
  <rect x="240" y="290" width="210" height="55" rx="6" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="345" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Ref Providers (default)</text>
  <text x="345" y="326" text-anchor="middle" font-size="10" fill="#666">Zero-config, in-memory seed data</text>
  <text x="345" y="340" text-anchor="middle" font-size="10" fill="#666">Instant prototyping, no API keys</text>

  <rect x="470" y="290" width="210" height="55" rx="6" fill="#fce4ec" stroke="#ef5350"/>
  <text x="575" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">Real Providers (config)</text>
  <text x="575" y="326" text-anchor="middle" font-size="10" fill="#666">Google, Microsoft, Slack, etc.</text>
  <text x="575" y="340" text-anchor="middle" font-size="10" fill="#666">Activate via application.properties</text>

  <!-- Footer -->
  <text x="460" y="390" text-anchor="middle" font-size="11" fill="#999">Startup: ~0.7s (JVM) | ~50ms (native) | Composable via classpath</text>
</svg>
