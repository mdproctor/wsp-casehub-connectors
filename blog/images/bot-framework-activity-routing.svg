<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Bot Framework Activity Routing</text>

  <!-- Webhook POST -->
  <rect x="260" y="50" width="200" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="73" text-anchor="middle" font-weight="500" fill="#334155">POST /connectors/teams-inbound</text>

  <!-- Arrow down -->
  <line x1="360" y1="86" x2="360" y2="108" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- JWT Validation -->
  <rect x="260" y="110" width="200" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="360" y="133" text-anchor="middle" font-weight="500" fill="#1e40af">BotFrameworkAuth.validate()</text>

  <!-- Arrow down -->
  <line x1="360" y1="146" x2="360" y2="168" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- Self-filter -->
  <rect x="280" y="170" width="160" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="191" text-anchor="middle" fill="#475569">Self-filter (from.id)</text>

  <!-- Arrow down -->
  <line x1="360" y1="202" x2="360" y2="224" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- Activity type diamond -->
  <polygon points="360,226 440,260 360,294 280,260" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="264" text-anchor="middle" font-weight="500" fill="#92400e">activity.type</text>

  <!-- Four branches -->

  <!-- message (left) -->
  <line x1="280" y1="260" x2="120" y2="260" stroke="#334155" marker-end="url(#arrow)"/>
  <rect x="20" y="244" width="90" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="65" y="265" text-anchor="middle" font-weight="500" fill="#15803d">message</text>

  <!-- message sub-flow -->
  <line x1="65" y1="276" x2="65" y2="304" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- Mention strip -->
  <rect x="10" y="306" width="110" height="28" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="65" y="325" text-anchor="middle" font-size="11" fill="#166534">Strip bot mention</text>

  <!-- Arrow down -->
  <line x1="65" y1="334" x2="65" y2="352" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- Command check diamond -->
  <polygon points="65,354 110,374 65,394 20,374" fill="#fef3c7" stroke="#d97706"/>
  <text x="65" y="378" text-anchor="middle" font-size="11" fill="#92400e">cmd?</text>

  <!-- Yes - command dispatch -->
  <line x1="20" y1="374" x2="0" y2="374" stroke="#334155"/>
  <line x1="0" y1="374" x2="0" y2="430" stroke="#334155"/>
  <line x1="0" y1="430" x2="18" y2="430" stroke="#334155" marker-end="url(#arrow)"/>
  <text x="6" y="402" font-size="10" fill="#6b7280">yes</text>
  <rect x="20" y="416" width="120" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="80" y="435" text-anchor="middle" font-size="11" fill="#5b21b6">CommandService →</text>
  <text x="80" y="455" text-anchor="middle" font-size="10" fill="#5b21b6">BotFrameworkClient</text>

  <!-- No - deliver -->
  <line x1="110" y1="374" x2="138" y2="374" stroke="#334155" marker-end="url(#arrow)"/>
  <text x="116" y="368" font-size="10" fill="#6b7280">no</text>
  <rect x="140" y="360" width="100" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="190" y="379" text-anchor="middle" font-size="11" fill="#1e40af">Delivered</text>

  <!-- Arrow from Delivered to Translator -->
  <line x1="190" y1="388" x2="190" y2="416" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="140" y="418" width="100" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="190" y="437" text-anchor="middle" font-size="11" fill="#1e40af">Translator →</text>
  <text x="190" y="457" text-anchor="middle" font-size="10" fill="#1e40af">ReceivedMessage</text>

  <!-- messageReaction (center-right) -->
  <line x1="360" y1="294" x2="360" y2="330" stroke="#334155" marker-end="url(#arrow)"/>
  <rect x="300" y="332" width="120" height="56" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="360" y="353" text-anchor="middle" font-weight="500" fill="#9d174d">Reaction</text>
  <text x="360" y="370" text-anchor="middle" font-size="10" fill="#9d174d">Flatten arrays →</text>
  <text x="360" y="383" text-anchor="middle" font-size="10" fill="#9d174d">1 msg per reaction</text>

  <!-- conversationUpdate (right) -->
  <line x1="440" y1="260" x2="530" y2="260" stroke="#334155" marker-end="url(#arrow)"/>
  <rect x="532" y="244" width="148" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="606" y="265" text-anchor="middle" fill="#64748b">conversationUpdate</text>
  <text x="606" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">→ Ignored (log)</text>

  <!-- other types -->
  <rect x="532" y="310" width="148" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="606" y="331" text-anchor="middle" fill="#94a3b8">other → Ignored</text>

  <!-- Legend -->
  <rect x="510" y="400" width="190" height="70" rx="6" fill="white" stroke="#e2e8f0"/>
  <rect x="520" y="412" width="12" height="12" rx="2" fill="#dcfce7" stroke="#16a34a"/>
  <text x="538" y="423" font-size="11" fill="#475569">Chat pipeline</text>
  <rect x="520" y="430" width="12" height="12" rx="2" fill="#fce7f3" stroke="#db2777"/>
  <text x="538" y="441" font-size="11" fill="#475569">CloudEvent pipeline</text>
  <rect x="520" y="448" width="12" height="12" rx="2" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="538" y="459" font-size="11" fill="#475569">Outbound API reply</text>
</svg>
