<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <style>
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .label { font-weight: 600; font-size: 12; fill: #374151; }
    .heading { font-weight: 700; font-size: 14; fill: #111827; }
    .sub { font-size: 11; fill: #6B7280; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="heading" font-size="15">Two Voice Call Modes</text>

  <!-- Provider-managed (top) -->
  <text x="20" y="60" class="heading" fill="#1E40AF">Provider-Managed</text>
  <text x="20" y="76" class="sub">Agent provides instruction → provider handles the conversation</text>

  <rect x="20" y="90" width="120" height="50" class="box" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="80" y="112" text-anchor="middle" class="label">Your Agent</text>
  <text x="80" y="126" text-anchor="middle" class="sub">instruction</text>

  <path d="M 140 115 L 195 115" class="arrow" stroke="#3B82F6"/>
  <text x="168" y="108" text-anchor="middle" class="sub" fill="#3B82F6">REST</text>

  <rect x="200" y="90" width="140" height="50" class="box" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="270" y="112" text-anchor="middle" class="label">Provider AI</text>
  <text x="270" y="126" text-anchor="middle" class="sub">handles TTS/STT</text>

  <path d="M 340 115 L 395 115" class="arrow" stroke="#3B82F6"/>
  <text x="368" y="108" text-anchor="middle" class="sub" fill="#3B82F6">PSTN</text>

  <rect x="400" y="90" width="120" height="50" class="box" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="460" y="112" text-anchor="middle" class="label">Human</text>
  <text x="460" y="126" text-anchor="middle" class="sub">on the phone</text>

  <path d="M 340 115 L 340 115" stroke="none"/>
  <rect x="560" y="90" width="140" height="50" class="box" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="4"/>
  <text x="630" y="112" text-anchor="middle" class="label">Transcript</text>
  <text x="630" y="126" text-anchor="middle" class="sub">returned after call</text>

  <path d="M 270 140 L 270 152 L 600 152 L 600 138" class="arrow" stroke="#F59E0B" stroke-dasharray="4"/>

  <!-- Platform-managed (bottom) -->
  <text x="20" y="195" class="heading" fill="#7C3AED">Platform-Managed (Agentic)</text>
  <text x="20" y="211" class="sub">Agent handles conversation with mid-call tool access</text>

  <rect x="20" y="225" width="120" height="70" class="box" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="80" y="250" text-anchor="middle" class="label">Your Agent</text>
  <text x="80" y="264" text-anchor="middle" class="sub">ConversationHandler</text>
  <text x="80" y="278" text-anchor="middle" class="sub">+ tools</text>

  <path d="M 140 260 L 195 260" class="arrow" stroke="#7C3AED"/>
  <text x="168" y="250" text-anchor="middle" class="sub" fill="#7C3AED">text</text>

  <rect x="200" y="225" width="140" height="70" class="box" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="270" y="248" text-anchor="middle" class="label">Provider</text>
  <text x="270" y="264" text-anchor="middle" class="sub">handles audio</text>
  <text x="270" y="278" text-anchor="middle" class="sub">WebSocket bridge</text>

  <path d="M 340 260 L 395 260" class="arrow" stroke="#7C3AED"/>
  <text x="368" y="250" text-anchor="middle" class="sub" fill="#7C3AED">PSTN</text>

  <rect x="400" y="225" width="120" height="70" class="box" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="460" y="255" text-anchor="middle" class="label">Human</text>
  <text x="460" y="270" text-anchor="middle" class="sub">on the phone</text>

  <!-- Tool access arrow -->
  <rect x="560" y="225" width="140" height="70" class="box" fill="#FFF7ED" stroke="#F97316"/>
  <text x="630" y="248" text-anchor="middle" class="label">Platform Tools</text>
  <text x="630" y="264" text-anchor="middle" class="sub">work queues, APIs,</text>
  <text x="630" y="278" text-anchor="middle" class="sub">human approval</text>

  <path d="M 80 295 L 80 320 L 600 320 L 600 295" class="arrow" stroke="#F97316" stroke-dasharray="4"/>
  <text x="340" y="316" text-anchor="middle" class="sub" fill="#F97316">mid-call tool access</text>
</svg>
