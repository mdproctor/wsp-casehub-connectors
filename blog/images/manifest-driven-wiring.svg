  <line x1="462" y1="330" x2="510" y2="310" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="462" y1="345" x2="510" y2="345" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="462" y1="360" x2="510" y2="380" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="512" y="290" width="190" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2"/>
  <text x="607" y="313" text-anchor="middle" fill="#4a148c">NumbrrsMobilePlatform</text>

  <rect x="512" y="330" width="190" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2"/>
  <text x="607" y="353" text-anchor="middle" fill="#4a148c">TelegramChatPlatform</text>

  <rect x="512" y="370" width="190" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2"/>
  <text x="607" y="393" text-anchor="middle" fill="#4a148c">SignalChatPlatform</text>

  <!-- Registry -->
  <rect x="540" y="420" width="140" height="30" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.2"/>
  <text x="610" y="440" text-anchor="middle" fill="#006064">ConnectorRegistry</text>
  <line x1="462" y1="375" x2="540" y2="430" stroke="#00838f" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="607" y="286" text-anchor="middle" font-size="11" fill="#888">CDI synthetic beans</text>
