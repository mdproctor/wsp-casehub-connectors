<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Before section -->
  <text x="180" y="24" font-size="15" font-weight="600" fill="#333" text-anchor="middle">Before — Bespoke Producers</text>

  <rect x="20" y="40" width="150" height="36" rx="4" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
  <text x="95" y="63" text-anchor="middle" fill="#b71c1c">NumbrrsMobileBeans</text>

  <rect x="20" y="86" width="150" height="36" rx="4" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
  <text x="95" y="109" text-anchor="middle" fill="#b71c1c">ChatTelegramBeans</text>

  <rect x="20" y="132" width="150" height="36" rx="4" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
  <text x="95" y="155" text-anchor="middle" fill="#b71c1c">ChatSignalBeans</text>

  <line x1="170" y1="58" x2="210" y2="58" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="170" y1="104" x2="210" y2="104" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="170" y1="150" x2="210" y2="150" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="212" y="40" width="130" height="36" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/>
  <text x="277" y="63" text-anchor="middle" fill="#283593">StaticCredStore</text>

  <rect x="212" y="86" width="130" height="36" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/>
  <text x="277" y="109" text-anchor="middle" fill="#283593">@ConfigProperty</text>

  <rect x="212" y="132" width="130" height="36" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/>
  <text x="277" y="155" text-anchor="middle" fill="#283593">@ConfigProperty</text>

  <text x="95" y="195" text-anchor="middle" font-size="11" fill="#888">Each connector: custom Java class,</text>
  <text x="95" y="210" text-anchor="middle" font-size="11" fill="#888">custom credential parsing, same pattern</text>

  <!-- Divider -->
  <line x1="0" y1="230" x2="720" y2="230" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- After section -->
  <text x="360" y="260" font-size="15" font-weight="600" fill="#333" text-anchor="middle">After — Manifest-Driven</text>

  <!-- Manifests -->
  <rect x="20" y="280" width="160" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="100" y="303" text-anchor="middle" fill="#1b5e20">numbrrs manifest.yaml</text>

  <rect x="20" y="324" width="160" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="100" y="347" text-anchor="middle" fill="#1b5e20">telegram manifest.yaml</text>

  <rect x="20" y="368" width="160" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="100" y="391" text-anchor="middle" fill="#1b5e20">signal manifest.yaml</text>

  <!-- Arrows to processor -->
  <line x1="180" y1="298" x2="250" y2="345" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="180" y1="342" x2="250" y2="345" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="180" y1="386" x2="250" y2="350" stroke="#555" marker-end="url(#arrow)"/>

