  <rect x="252" y="310" width="210" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="357" y="335" text-anchor="middle" font-weight="600" fill="#0d47a1">ConnectorLifecycle</text>
  <text x="357" y="352" text-anchor="middle" font-weight="600" fill="#0d47a1">Processor</text>
  <text x="357" y="375" text-anchor="middle" font-size="11" fill="#1565c0">SyntheticBeanBuildItem</text>

  <!-- Credential Facade -->
  <rect x="280" y="415" width="165" height="32" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="362" y="436" text-anchor="middle" fill="#bf360c">CredentialFacade</text>
  <line x1="357" y1="390" x2="357" y2="413" stroke="#e65100" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

