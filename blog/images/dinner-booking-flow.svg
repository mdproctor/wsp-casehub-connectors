<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <style>
    .step { rx: 8; ry: 8; stroke-width: 1.5; }
    .label { font-weight: 600; font-size: 11; }
    .domain { font-weight: 700; font-size: 10; letter-spacing: 0.5px; }
    .connector { stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#9CA3AF"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-weight="700" font-size="15" fill="#111827">Dinner Booking — Five Domains, Six Steps</text>

  <!-- Step 1: Location search -->
  <rect x="20" y="50" width="120" height="65" class="step" fill="#ECFDF5" stroke="#10B981"/>
  <text x="80" y="68" text-anchor="middle" class="domain" fill="#059669">LOCATION</text>
  <text x="80" y="84" text-anchor="middle" class="label" fill="#374151">Find Thai</text>
  <text x="80" y="97" text-anchor="middle" font-size="10" fill="#6B7280">restaurants nearby</text>

  <path d="M 140 82 L 165 82" class="connector" stroke="#9CA3AF"/>

  <!-- Step 2: Place details -->
  <rect x="170" y="50" width="110" height="65" class="step" fill="#ECFDF5" stroke="#10B981"/>
  <text x="225" y="68" text-anchor="middle" class="domain" fill="#059669">LOCATION</text>
  <text x="225" y="84" text-anchor="middle" class="label" fill="#374151">Get details</text>
  <text x="225" y="97" text-anchor="middle" font-size="10" fill="#6B7280">phone, address</text>

  <path d="M 280 82 L 305 82" class="connector" stroke="#9CA3AF"/>

  <!-- Step 3: Voice call -->
  <rect x="310" y="42" width="130" height="80" class="step" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="375" y="60" text-anchor="middle" class="domain" fill="#7C3AED">MOBILE</text>
  <text x="375" y="78" text-anchor="middle" class="label" fill="#374151">Voice call</text>
  <text x="375" y="93" text-anchor="middle" font-size="10" fill="#6B7280">"Book a table</text>
  <text x="375" y="105" text-anchor="middle" font-size="10" fill="#6B7280">for 2 at 7pm"</text>

  <!-- Fan out from voice call -->
  <path d="M 375 122 L 375 150" class="connector" stroke="#9CA3AF"/>

  <!-- Three parallel outputs -->
  <!-- SMS -->
  <rect x="50" y="165" width="130" height="55" class="step" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="115" y="183" text-anchor="middle" class="domain" fill="#7C3AED">MOBILE</text>
  <text x="115" y="199" text-anchor="middle" class="label" fill="#374151">SMS confirm</text>
  <text x="115" y="212" text-anchor="middle" font-size="10" fill="#6B7280">to yourself</text>

  <path d="M 375 150 L 115 165" class="connector" stroke="#9CA3AF"/>

  <!-- Email -->
  <rect x="280" y="165" width="130" height="55" class="step" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="345" y="183" text-anchor="middle" class="domain" fill="#D97706">EMAIL</text>
  <text x="345" y="199" text-anchor="middle" class="label" fill="#374151">Email confirm</text>
  <text x="345" y="212" text-anchor="middle" font-size="10" fill="#6B7280">to restaurant</text>

  <path d="M 375 150 L 345 165" class="connector" stroke="#9CA3AF"/>

  <!-- Chat -->
  <rect x="510" y="165" width="130" height="55" class="step" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="575" y="183" text-anchor="middle" class="domain" fill="#2563EB">CHAT</text>
  <text x="575" y="199" text-anchor="middle" class="label" fill="#374151">Chat notify</text>
  <text x="575" y="212" text-anchor="middle" font-size="10" fill="#6B7280">"dinner sorted"</text>

  <path d="M 375 150 L 575 165" class="connector" stroke="#9CA3AF"/>

  <!-- Bottom label -->
  <text x="350" y="255" text-anchor="middle" font-size="11" fill="#9CA3AF">Location + Mobile + Email + Chat — one playbook, six steps</text>
</svg>
