<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="8" fill="url(#bgGrad)" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Attachment Download — Before &amp; After</text>

  <!-- BEFORE column -->
  <text x="180" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">BEFORE</text>
  <rect x="40" y="72" width="280" height="38" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="88" text-anchor="middle" font-size="12" fill="#1e293b">contentUrl from activity JSON</text>
  <text x="180" y="102" text-anchor="middle" font-size="10" fill="#64748b">attacker-controlled if service is compromised</text>
  <line x1="180" y1="110" x2="180" y2="132" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="60" y="135" width="240" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="154" text-anchor="middle" font-size="12" fill="#991b1b">No host validation</text>
  <line x1="180" y1="165" x2="180" y2="187" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="40" y="190" width="280" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="206" text-anchor="middle" font-size="12" fill="#991b1b">GET + Bearer token to any host</text>
  <text x="180" y="220" text-anchor="middle" font-size="10" fill="#b91c1c">⚠ SSRF — token leaks to attacker</text>

  <!-- Divider -->
  <line x1="360" y1="55" x2="360" y2="280" stroke="#e2e8f0" stroke-dasharray="4,4"/>

  <!-- AFTER column -->
  <text x="540" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">AFTER</text>
  <rect x="400" y="72" width="280" height="38" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="88" text-anchor="middle" font-size="12" fill="#1e293b">contentUrl from activity JSON</text>
  <text x="540" y="102" text-anchor="middle" font-size="10" fill="#64748b">same source, now validated</text>
  <line x1="540" y1="110" x2="540" y2="132" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="410" y="135" width="260" height="38" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="540" y="151" text-anchor="middle" font-size="12" fill="#166534">Host allowlist check</text>
  <text x="540" y="165" text-anchor="middle" font-size="10" fill="#15803d">*.sharepoint.com, graph.microsoft.com, …</text>
  <line x1="470" y1="173" x2="470" y2="195" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="610" y1="173" x2="610" y2="195" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="410" y="198" width="120" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="470" y="217" text-anchor="middle" font-size="11" fill="#166534">✓ Allowed</text>
  <rect x="550" y="198" width="120" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="610" y="217" text-anchor="middle" font-size="11" fill="#991b1b">✗ Rejected</text>
  <line x1="470" y1="228" x2="470" y2="248" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="410" y="251" width="120" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#166534">GET + Bearer</text>
  <text x="610" y="250" text-anchor="middle" font-size="10" fill="#b91c1c">log + return null</text>
</svg>
